<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mind of Aravalli — Living Encyclopedia & Knowledge Framework</title>
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700;800&family=Inter:wght@300;400;500;600;700&family=Lora:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600&family=JetBrains+Mono:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet" />
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            serif: ['Lora', 'Georgia', 'serif'],
            display: ['Cinzel', 'Lora', 'serif'],
            mono: ['JetBrains Mono', 'monospace'],
          },
          colors: {
            editorial: {
              cream: '#fbfaf7',
              paper: '#f6f4ee',
              ink: '#1c2226',
              muted: '#5c6469',
              border: '#e4dfd5',
              darkBg: '#090d13',
              darkPaper: '#0f1622',
              darkBorder: '#1c2637',
              accent: '#15803d',
              accentLight: '#22c55e',
            }
          }
        }
      }
    }
  </script>

  <!-- KaTeX for Mathematics -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css" />
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/contrib/auto-render.min.js"></script>

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    html {
      scroll-behavior: smooth;
    }
    body {
      transition: background-color 0.25s ease, color 0.25s ease;
      font-feature-settings: "cv02", "cv03", "cv04", "cv11";
      text-rendering: optimizeLegibility;
      -webkit-font-smoothing: antialiased;
    }
    
    .prose-magazine > p:first-of-type::first-letter {
      font-family: 'Cinzel', 'Lora', serif;
      font-size: 3.8rem;
      line-height: 0.85;
      float: left;
      margin-top: 0.15rem;
      margin-right: 0.85rem;
      margin-bottom: -0.1rem;
      font-weight: 700;
      color: #15803d;
    }
    .dark .prose-magazine > p:first-of-type::first-letter {
      color: #34d399;
    }

    .diagram-panel {
      font-family: 'JetBrains Mono', monospace;
      letter-spacing: -0.015em;
      line-height: 1.5;
      font-size: 0.78rem;
      overflow-x: auto;
      white-space: pre;
    }

    .math-block {
      overflow-x: auto;
      padding: 1.25rem;
      border-radius: 0.75rem;
      margin: 1.75rem 0;
      font-family: 'Lora', serif;
    }

    .active-nav-chapter {
      border-left-color: #15803d !important;
      background-color: rgba(21, 128, 61, 0.08) !important;
      color: #15803d !important;
      font-weight: 600;
    }
    .dark .active-nav-chapter {
      border-left-color: #34d399 !important;
      background-color: rgba(52, 211, 153, 0.1) !important;
      color: #34d399 !important;
    }

    ::-webkit-scrollbar {
      width: 5px;
      height: 5px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(156, 163, 175, 0.3);
      border-radius: 9999px;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col antialiased bg-[#fbfaf7] dark:bg-[#090d13] text-[#1c2226] dark:text-[#dbe3eb] selection:bg-emerald-500/20 selection:text-emerald-800 dark:selection:text-emerald-300">

  <!-- Top Header -->
  <header class="sticky top-0 z-40 w-full bg-[#fbfaf7]/95 dark:bg-[#090d13]/95 backdrop-blur-md border-b border-[#e4dfd5] dark:border-[#1c2637] transition-colors">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-18 py-3 flex items-center justify-between">
      <!-- Masthead -->
      <a href="#home" onclick="navigate('home')" class="flex items-center space-x-3 group">
        <div class="w-9 h-9 rounded-md bg-[#15803d]/10 dark:bg-emerald-500/10 border border-[#15803d]/30 dark:border-emerald-500/30 flex items-center justify-center text-[#15803d] dark:text-emerald-400 font-serif font-bold text-base group-hover:scale-105 transition-transform">
          A
        </div>
        <div class="flex flex-col">
          <span class="font-serif font-bold text-base tracking-tight text-[#1c2226] dark:text-white uppercase">
            Mind of Aravalli
          </span>
          <span class="text-[9px] font-mono uppercase tracking-widest text-[#15803d] dark:text-emerald-400 font-semibold">
            Living Encyclopedia Framework
          </span>
        </div>
      </a>

      <!-- Navigation -->
      <nav class="hidden md:flex items-center space-x-1 text-xs font-mono">
        <button onclick="navigate('home')" class="px-3.5 py-2 rounded-lg text-[#5c6469] dark:text-slate-300 hover:text-[#1c2226] dark:hover:text-white hover:bg-black/5 dark:hover:bg-white/5 transition-colors font-medium">Home</button>
        <button onclick="navigate('volumes')" class="px-3.5 py-2 rounded-lg text-[#5c6469] dark:text-slate-300 hover:text-[#1c2226] dark:hover:text-white hover:bg-black/5 dark:hover:bg-white/5 transition-colors font-medium">Volumes</button>
        <button onclick="navigate('framework')" class="px-3.5 py-2 rounded-lg text-[#5c6469] dark:text-slate-300 hover:text-[#1c2226] dark:hover:text-white hover:bg-black/5 dark:hover:bg-white/5 transition-colors font-medium">Framework & Invariants</button>
        <button onclick="openSearch()" class="px-3.5 py-2 rounded-lg bg-[#f0ebe1] dark:bg-[#131b28] text-[#5c6469] dark:text-slate-400 hover:text-[#1c2226] dark:hover:text-white transition-colors flex items-center gap-2 ml-2 border border-[#e4dfd5] dark:border-[#1c2637]">
          <i data-lucide="search" class="w-3.5 h-3.5 text-[#15803d] dark:text-emerald-400"></i>
          <span>Search</span>
          <kbd class="text-[10px] bg-black/5 dark:bg-black/40 px-1.5 py-0.5 rounded text-[#5c6469] dark:text-slate-400">Ctrl K</kbd>
        </button>
      </nav>

      <!-- Right Controls -->
      <div class="flex items-center space-x-2">
        <button id="theme-toggle-btn" onclick="toggleTheme()" class="p-2 rounded-lg text-[#5c6469] dark:text-slate-300 hover:text-[#1c2226] dark:hover:text-white hover:bg-black/5 dark:hover:bg-white/5 transition-colors" title="Toggle theme">
          <i id="theme-icon" data-lucide="sun" class="w-4 h-4"></i>
        </button>
        <button onclick="toggleMobileMenu()" class="md:hidden p-2 rounded-lg text-[#5c6469] dark:text-slate-300 hover:bg-black/5 dark:hover:bg-white/5">
          <i id="mobile-menu-icon" data-lucide="menu" class="w-5 h-5"></i>
        </button>
      </div>
    </div>

    <!-- Mobile Drawer -->
    <div id="mobile-drawer" class="hidden md:hidden border-b border-[#e4dfd5] dark:border-[#1c2637] bg-[#fbfaf7] dark:bg-[#090d13] px-4 py-3 space-y-2 text-xs font-mono">
      <button onclick="navigate('home'); toggleMobileMenu();" class="w-full text-left py-2 px-3 rounded-lg hover:bg-black/5 dark:hover:bg-white/5 flex items-center gap-2">
        <i data-lucide="home" class="w-4 h-4 text-[#15803d] dark:text-emerald-400"></i>
        <span>Home</span>
      </button>
      <button onclick="navigate('volumes'); toggleMobileMenu();" class="w-full text-left py-2 px-3 rounded-lg hover:bg-black/5 dark:hover:bg-white/5 flex items-center gap-2">
        <i data-lucide="layers" class="w-4 h-4 text-[#15803d] dark:text-emerald-400"></i>
        <span>Volumes</span>
      </button>
      <button onclick="navigate('framework'); toggleMobileMenu();" class="w-full text-left py-2 px-3 rounded-lg hover:bg-black/5 dark:hover:bg-white/5 flex items-center gap-2">
        <i data-lucide="shield-check" class="w-4 h-4 text-[#15803d] dark:text-emerald-400"></i>
        <span>Framework & Invariants</span>
      </button>
    </div>
  </header>

  <!-- Main View Container -->
  <main id="app-root" class="flex-1 w-full mx-auto">
    <!-- Injected dynamically -->
  </main>

  <!-- Search Modal -->
  <div id="search-modal" onclick="handleModalBackdropClick(event)" class="fixed inset-0 z-50 bg-black/60 backdrop-blur-xs hidden flex items-start justify-center pt-16 sm:pt-24 px-4">
    <div class="w-full max-w-2xl bg-[#fbfaf7] dark:bg-[#0f1622] rounded-2xl border border-[#e4dfd5] dark:border-[#1c2637] shadow-2xl overflow-hidden flex flex-col max-h-[80vh]" onclick="event.stopPropagation()">
      <div class="p-4 border-b border-[#e4dfd5] dark:border-[#1c2637] flex items-center gap-3">
        <i data-lucide="search" class="w-5 h-5 text-[#15803d] dark:text-emerald-400"></i>
        <input 
          id="search-input" 
          type="text" 
          placeholder="Search chapters, models, frameworks..." 
          class="w-full bg-transparent text-sm sm:text-base focus:outline-none text-[#1c2226] dark:text-white placeholder-[#5c6469]"
          oninput="handleSearch(this.value)"
        />
        <button onclick="closeSearch()" class="p-1.5 rounded-lg text-[#5c6469] hover:text-[#1c2226] dark:hover:text-white">
          <i data-lucide="x" class="w-4 h-4"></i>
        </button>
      </div>
      <div id="search-results" class="p-4 overflow-y-auto space-y-2 flex-1 divide-y divide-[#e4dfd5] dark:divide-[#1c2637]">
        <!-- Search Results -->
      </div>
    </div>
  </div>

  <!-- Footer -->
  <footer class="border-t border-[#e4dfd5] dark:border-[#1c2637] bg-[#f6f4ee] dark:bg-[#090d13] py-10 text-xs font-serif text-[#5c6469] dark:text-slate-400 transition-colors mt-auto">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex flex-col sm:flex-row items-center justify-between gap-4">
      <div class="flex items-center space-x-2">
        <span class="w-2 h-2 rounded-full bg-[#15803d] dark:bg-emerald-400"></span>
        <span>Mind of Aravalli · Living Knowledge Architecture</span>
      </div>
      <div class="flex items-center space-x-4 font-mono text-[11px]">
        <a href="https://github.com/vs00918/aravalli" target="_blank" class="hover:text-[#15803d] dark:hover:text-emerald-400 underline transition-colors">
          github.com/vs00918/aravalli
        </a>
      </div>
    </div>
  </footer>

  <!-- Script -->
  <script>
    let KNOWLEDGE_DB = { volumes: [], chapters: {} };

    async function loadDatabase() {
      try {
        const res = await fetch('data/knowledge-registry.json');
        if (res.ok) {
          KNOWLEDGE_DB = await res.json();
        }
      } catch (e) {
        console.log('Using default knowledge DB');
      }
    }

    let currentView = 'home';
    let currentParam = null;

    async function init() {
      const savedTheme = localStorage.getItem('aravalli_theme') || 'dark';
      if (savedTheme === 'dark') {
        document.documentElement.classList.add('dark');
        document.getElementById('theme-icon')?.setAttribute('data-lucide', 'sun');
      } else {
        document.documentElement.classList.remove('dark');
        document.getElementById('theme-icon')?.setAttribute('data-lucide', 'moon');
      }

      await loadDatabase();

      window.addEventListener('hashchange', handleRoute);
      handleRoute();

      window.addEventListener('keydown', (e) => {
        if ((e.ctrlKey || e.metaKey) && e.key === 'k') {
          e.preventDefault();
          openSearch();
        }
        if (e.key === 'Escape') {
          closeSearch();
        }
      });
    }

    function toggleTheme() {
      const isDark = document.documentElement.classList.toggle('dark');
      localStorage.setItem('aravalli_theme', isDark ? 'dark' : 'light');
      const icon = document.getElementById('theme-icon');
      if (icon) {
        icon.setAttribute('data-lucide', isDark ? 'sun' : 'moon');
        if (window.lucide) lucide.createIcons();
      }
    }

    function toggleMobileMenu() {
      const drawer = document.getElementById('mobile-drawer');
      drawer.classList.toggle('hidden');
    }

    function handleRoute() {
      const hash = window.location.hash.slice(1) || 'home';
      const parts = hash.split('/');
      currentView = parts[0] || 'home';
      currentParam = parts.slice(1).join('/');

      const container = document.getElementById('app-root');
      if (!container) return;

      window.scrollTo(0, 0);

      switch (currentView) {
        case 'home':
          renderHome(container);
          break;
        case 'volumes':
          renderVolumes(container);
          break;
        case 'framework':
          renderFramework(container);
          break;
        default:
          renderHome(container);
      }

      if (window.lucide) lucide.createIcons();
    }

    function navigate(view, param = null) {
      if (param) {
        window.location.hash = `${view}/${param}`;
      } else {
        window.location.hash = view;
      }
    }

    function renderHome(container) {
      const hasContent = KNOWLEDGE_DB.volumes && KNOWLEDGE_DB.volumes.length > 0;

      container.innerHTML = `
        <div class="max-w-5xl mx-auto px-4 sm:px-6 lg:px-8 space-y-16 py-12">
          <!-- Hero Section -->
          <div class="space-y-6 text-center max-w-3xl mx-auto py-10 border-b border-[#e4dfd5] dark:border-[#1c2637] pb-14">
            <div class="inline-flex items-center gap-2 px-3.5 py-1 rounded-full bg-[#15803d]/10 dark:bg-emerald-500/10 border border-[#15803d]/30 dark:border-emerald-500/30 text-[#15803d] dark:text-emerald-400 text-xs font-mono font-medium">
              <span class="w-2 h-2 rounded-full bg-[#15803d] dark:bg-emerald-400 animate-pulse"></span>
              <span>Living Knowledge Base & Synthesis Engine</span>
            </div>
            <h1 class="text-4xl sm:text-6xl font-serif font-bold text-[#1c2226] dark:text-white tracking-tight leading-tight">
              Mind of <span class="text-[#15803d] dark:text-emerald-400 italic">Aravalli</span>
            </h1>
            <p class="text-lg text-[#5c6469] dark:text-slate-400 font-serif leading-relaxed max-w-2xl mx-auto">
              A clean slate knowledge engine built for first-principles synthesis, continuous volume streams, and noise-free cognitive retention.
            </p>
          </div>

          <!-- Clean Framework Status -->
          <div class="p-8 rounded-2xl border border-[#e4dfd5] dark:border-[#1c2637] bg-white/70 dark:bg-[#0f1622] text-center space-y-4">
            <div class="inline-flex items-center justify-center w-12 h-12 rounded-full bg-[#15803d]/10 text-[#15803d] dark:text-emerald-400">
              <i data-lucide="sparkles" class="w-6 h-6"></i>
            </div>
            <h2 class="text-2xl font-serif font-bold text-[#1c2226] dark:text-white">Workspace Cleaned & Framework Ready</h2>
            <p class="text-sm text-[#5c6469] dark:text-slate-400 font-serif max-w-lg mx-auto leading-relaxed">
              All previous temporary content has been cleared. The synthesis pipeline, continuous reading architecture, and core invariants are ready for new input.
            </p>
            <div class="pt-2 flex items-center justify-center gap-3 font-mono text-xs">
              <button onclick="navigate('framework')" class="px-5 py-2.5 rounded-xl bg-[#15803d] hover:bg-[#166534] text-white font-semibold flex items-center gap-2">
                <span>View Operating Invariants</span>
                <i data-lucide="arrow-right" class="w-3.5 h-3.5"></i>
              </button>
            </div>
          </div>
        </div>
      `;
    }

    function renderVolumes(container) {
      container.innerHTML = `
        <div class="max-w-5xl mx-auto px-4 sm:px-6 lg:px-8 space-y-8 py-10">
          <div class="space-y-2 border-b border-[#e4dfd5] dark:border-[#1c2637] pb-6">
            <span class="text-xs font-mono uppercase tracking-widest text-[#15803d] dark:text-emerald-400 font-bold">Volumes</span>
            <h1 class="text-3xl sm:text-4xl font-serif font-bold text-[#1c2226] dark:text-white">Knowledge Volumes</h1>
            <p class="text-sm text-[#5c6469] dark:text-slate-400 font-serif">Awaiting new knowledge ingestion.</p>
          </div>
          <div class="p-12 text-center text-[#5c6469] dark:text-slate-400 font-serif space-y-2">
            <p class="text-base">No volumes ingested yet.</p>
            <p class="text-xs font-mono text-slate-500">Provide videos, lectures, or texts to begin the continuous knowledge stream.</p>
          </div>
        </div>
      `;
    }

    function renderFramework(container) {
      container.innerHTML = `
        <div class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 space-y-10 py-10">
          <div class="space-y-2 border-b border-[#e4dfd5] dark:border-[#1c2637] pb-6">
            <span class="text-xs font-mono uppercase tracking-widest text-[#15803d] dark:text-emerald-400 font-bold">Rules & Architecture</span>
            <h1 class="text-3xl sm:text-4xl font-serif font-bold text-[#1c2226] dark:text-white">Continuous Ingestion Invariant</h1>
            <p class="text-sm text-[#5c6469] dark:text-slate-400 font-serif">The operating rules governing all knowledge acquisition in Mind of Aravalli.</p>
          </div>
          
          <div class="space-y-6 text-sm font-serif leading-relaxed text-[#2c3437] dark:text-[#cbd5e1]">
            <div class="p-6 rounded-2xl border border-[#e4dfd5] dark:border-[#1c2637] bg-white/70 dark:bg-[#0f1622] space-y-3">
              <h2 class="text-lg font-bold text-[#1c2226] dark:text-white font-serif">1. Continuation of Existing Knowledge</h2>
              <p>If new incoming information deepens or refines an existing concept, merge it seamlessly into the existing chapter to expand its depth rather than creating fragmented duplicate files.</p>
            </div>

            <div class="p-6 rounded-2xl border border-[#e4dfd5] dark:border-[#1c2637] bg-white/70 dark:bg-[#0f1622] space-y-3">
              <h2 class="text-lg font-bold text-[#1c2226] dark:text-white font-serif">2. Truly New Concepts</h2>
              <p>If it introduces a genuinely new cognitive mechanism, framework, or protocol, add it as the next chronological chapter in its respective Volume.</p>
            </div>

            <div class="p-6 rounded-2xl border border-[#e4dfd5] dark:border-[#1c2637] bg-white/70 dark:bg-[#0f1622] space-y-3">
              <h2 class="text-lg font-bold text-[#1c2226] dark:text-white font-serif">3. Skip Duplication</h2>
              <p>Detect and skip redundant information, preserving only the highest signal density and clearest mental models.</p>
            </div>

            <div class="p-6 rounded-2xl border border-[#e4dfd5] dark:border-[#1c2637] bg-white/70 dark:bg-[#0f1622] space-y-3">
              <h2 class="text-lg font-bold text-[#1c2226] dark:text-white font-serif">4. Rigorous Auditing</h2>
              <p>Audit all claims against first-principles science and cognitive psychology before synthesizing.</p>
            </div>
          </div>
        </div>
      `;
    }

    function openSearch() {
      document.getElementById('search-modal').classList.remove('hidden');
      setTimeout(() => document.getElementById('search-input').focus(), 50);
      handleSearch('');
    }

    function closeSearch() {
      document.getElementById('search-modal').classList.add('hidden');
    }

    function handleModalBackdropClick(e) {
      if (e.target.id === 'search-modal') {
        closeSearch();
      }
    }

    function handleSearch(query) {
      const resultsContainer = document.getElementById('search-results');
      resultsContainer.innerHTML = `
        <div class="p-4 text-center text-xs font-mono text-[#5c6469]">
          Knowledge base is clean. Search will be active as new chapters are ingested.
        </div>
      `;
    }

    document.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
