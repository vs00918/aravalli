name: Deploy Mind of Aravalli & Living Codex to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: "file:./dev.db"
      NEXT_PUBLIC_BASE_PATH: "/aravalli"
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Root Dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Compile Canonical Knowledge
        run: npm run compile:banking-ca

      - name: Run Banking Test Suites
        run: |
          npm run test:compiler
          npm run test:search
          npm run test:revision
          npm run test:pwa
          npm run test:qa

      - name: Run Static Analysis & Linting
        run: |
          npm run type-check
          npm run lint

      - name: Build Banking App Static Export
        run: npm run build

      - name: Build & Test Living Codex
        run: |
          cd codex
          npm install
          npm test
          npm run build
          cd ..
          mkdir -p out/ytdecoded
          cp -r codex/dist/* out/ytdecoded/

      - name: Ensure .nojekyll Exists
        run: touch out/.nojekyll

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Static Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "./out"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
