                "difficulty": "INTERMEDIATE",
                "oneLiner": "Entropy measures how many microscopic arrangements can produce the larger-scale state we observe. In an isolated system, processes naturally drift toward the macroscopic state that corresponds to the overwhelmingly largest number of accessible microscopic configurations.",
                "whyItMatters": "Understanding entropy unlocks the physical foundation for heat engines, refrigeration, chemical equilibrium, data compression limits, and why time has a fixed forward direction.",
                "intuition": "### 0. The Physical Puzzle: Why Does Gas Spread?\nImagine a glass partition dividing a sealed, rigid box into two equal halves. The left half is filled with gas; the right half is a complete vacuum.\n\nWhen you slide the partition open, the gas molecules immediately rush across the boundary until they are evenly spread throughout the entire box.\n\nWhy does this happen? There is no attractive force pulling molecules into the empty half. No molecule \"knows\" the right side is empty. Every molecule simply continues colliding and bouncing according to basic mechanical laws.\n\nYet, you will never in human history see all the gas molecules spontaneously gather back into the left half of the box. Why is the process strictly irreversible?\n\n### 1. The Mental Model: Distinguishable Coins & Shuffled Cards\nImagine a brand new deck of playing cards arranged in pristine numerical order by suit. There is only **1 exact sequence** that is considered \"perfectly sorted.\"\n\nHowever, there are roughly $8 \\times 10^{67}$ possible ways to shuffle the cards into an unsorted arrangement. If you drop the deck onto the floor, the cards will land in an unsorted state—not because of a mysterious destructive force, but simply because unsorted configurations overwhelmingly outnumber sorted ones by an unfathomable ratio.\n\n### 2. Where This Mental Model Stops Being Accurate\nPlaying cards sitting on a floor are completely static; they have no thermal energy and do not collide with one another. Gas molecules, by contrast, are in constant, violent motion, undergoing roughly $10^9$ elastic collisions per second at room temperature. This constant thermal agitation causes the gas system to continuously explore different microscopic configurations at immense speed.",
                "example": "**Everyday Observation**: A drop of blue ink spreading in a glass of clear water.\n- **Analogy Boundary**: The ink spreading looks continuous to the eye, but beneath the surface it is driven by trillions of random water molecule collisions (Brownian motion) pushing ink molecules into the overwhelmingly larger volume of clear water.",
                "howItWorks": "### 3. Step-by-Step Causal Mechanism: The 10-Particle Toy Model\n\nTo understand exactly why systems drift toward equilibrium, consider a simplified container divided into a Left side ($L$) and a Right side ($R$), containing just **10 distinguishable gas particles** labeled A through J.\n\n- A **Microstate** is the exact list of which specific particles are in which half (e.g. Particles A, B, C in Left; D through J in Right).\n- A **Macrostate** is the total number of particles on the Left side ($N_L$), regardless of their individual identities.\n\nThe total number of possible microstates for 10 particles is:\n$$2^{10} = 1024 \\text{ total microstates}$$\n\nLet us count the number of microstates (the multiplicity $\\Omega$) for each macrostate using the binomial coefficient $\\binom{10}{N_L}$:\n\n| Macrostate ($N_L$) | Multiplicity $\\Omega = \\binom{10}{N_L}$ | Probability | Physical State Description |\n| :--- | :--- | :--- | :--- |\n| **10 Left, 0 Right** | $\\binom{10}{10} = 1$ | $1 / 1024 \\approx 0.10\\%$ | All particles in original corner |\n| **9 Left, 1 Right** | $\\binom{10}{9} = 10$ | $10 / 1024 \\approx 0.98\\%$ | Highly unbalanced |\n| **8 Left, 2 Right** | $\\binom{10}{8} = 45$ | $45 / 1024 \\approx 4.39\\%$ | Unbalanced |\n| **7 Left, 3 Right** | $\\binom{10}{7} = 120$ | $120 / 1024 \\approx 11.72\\%$ | Slight fluctuation |\n| **6 Left, 4 Right** | $\\binom{10}{6} = 210$ | $210 / 1024 \\approx 20.51\\%$ | Near equilibrium |\n| **5 Left, 5 Right** | $\\binom{10}{5} = 252$ | $252 / 1024 \\approx 24.61\\%$ | **Equilibrium (Even Spread)** |\n\n---\n\n### The Causal Sequence:\n1. **Initial Non-Equilibrium State**: All particles start in Left ($N_L = 10$). Multiplicity $\\Omega = 1$.\n2. **Thermal Agitation**: Particles bounce randomly between halves. Every microstate is equally likely.\n3. **Statistical Inevitability**: Because there are 252 microstates for $(5L, 5R)$ and only 1 microstate for $(10L, 0R)$, the system is **252 times more likely** to be found near equilibrium than in the corner.\n4. **Scaling to Avogadro Scale ($N = 10^{23}$)**: For a real mole of gas, the multiplicity of the 50/50 macrostate is $\\sim 2^{10^{23}}$. The probability of observing even a $0.001\\%$ spontaneous fluctuation away from uniform density is less than 1 in $10^{10^{20}}$—a statistical impossibility over the age of the universe.\n\n---\n\n### What Changes Microscopically vs. Macroscopically:\n- **What moves?** Individual gas molecules with thermal kinetic velocity $v_{\\text{rms}} = \\sqrt{3k_B T / m}$.\n- **Why does it move?** Thermal kinetic energy.\n- **What changes microscopically?** The system continuously changes its specific microstate every femtosecond.\n- **What changes macroscopically?** Density and pressure equalize throughout the volume; macroscopic observable properties become static.\n- **What remains conserved?** Total energy $E$, total volume $V$, and total particle number $N$.",
                "firstPrinciples": "### 4. Foundational Axioms of Statistical Mechanics\n\n1. **The Fundamental Assumption of the Microcanonical Ensemble**:\n   For an isolated system in equilibrium with fixed energy $E$, volume $V$, and particle number $N$, **all accessible microstates are equally probable**. The laws of physics do not favor any single microstate over another.\n2. **Microscopic Reversibility vs. Macroscopic Irreversibility**:\n   The underlying laws of motion (Newtonian mechanics, Maxwell's electrodynamics, Schrödinger's wave mechanics) are time-reversible. If you instantaneously reversed the velocity vector of every single particle, the system would reassemble into the left corner. However, because equilibrium microstates outnumber non-equilibrium microstates by factors of $10^{10^{23}}$, spontaneous reversal is statistically impossible.\n\n### Epistemic Categorization:\n- **LAW**: The Second Law of Thermodynamics (for an isolated system, $\\Delta S \\ge 0$).\n- **STATISTICAL RESULT**: Multiplicity $\\Omega$ peaks overwhelmingly at uniform spatial and thermal distribution.\n- **MODEL**: The ideal gas microcanonical ensemble.\n- **INTERPRETATION**: The thermodynamic arrow of time (the universe evolves from a low-entropy initial state at the Big Bang toward higher entropy).",
                "mathematics": "### 1. What Question Is the Equation Answering?\n*\"How do we mathematically quantify microstate multiplicity so that entropy behaves as an extensive, additive physical property?\"*\n\n---\n\n### 2. Derivation: Why the Logarithm Appears\n\nConsider two completely independent physical systems, System A and System B:\n- System A has $\\Omega_A$ accessible microstates.\n- System B has $\\Omega_B$ accessible microstates.\n\nBecause the two systems are independent, the total number of composite microstates for the combined system $(A+B)$ is multiplicative:\n$$\\Omega_{AB} = \\Omega_A \\times \\Omega_B$$\n\nHowever, in thermodynamics, we demand that extensive physical properties (like mass, volume, and total energy) are **additive**:\n$$S_{AB} = S_A + S_B$$\n\nThe unique continuous mathematical function that converts multiplication into addition is the **natural logarithm**:\n$$\\ln(\\Omega_A \\cdot \\Omega_B) = \\ln \\Omega_A + \\ln \\Omega_B$$\n\nTherefore, Ludwig Boltzmann defined statistical entropy as:\n$$S = k_B \\ln \\Omega$$\n\n$$S_{AB} = k_B \\ln(\\Omega_A \\Omega_B) = k_B \\ln \\Omega_A + k_B \\ln \\Omega_B = S_A + S_B$$\n\n---\n\n### 3. Variable Definitions & Units\n\n| Symbol | Definition | Physical Units | Role |\n| :--- | :--- | :--- | :--- |\n| **$S$** | Thermodynamic / Statistical Entropy | $\\text{J}/\\text{K}$ (Joules per Kelvin) | Quantifies extensive phase space volume |\n| **$k_B$** | Boltzmann Constant | $1.380649 \\times 10^{-23} \\text{ J}/\\text{K}$ | Bridges microscopic energy ($k_B T$) to macroscopic temperature |\n| **$\\Omega$** | Microstate Multiplicity | Dimensionless integer | Number of quantum/classical microstates for a given macrostate |\n\n---\n\n### 4. The Thermodynamic Relation (Clausius Definition)\n\nIn classical macroscopic thermodynamics, Rudolf Clausius defined the infinitesimal change in entropy during a reversible heat transfer as:\n\n$$dS = \\frac{\\delta Q_{\\text{rev}}}{T}$$\n\n- **$\\delta Q_{\\text{rev}}$**: Infinitesimal heat energy added reversibly to the system (Joules, $\\text{J}$).\n- **$T$**: Absolute thermodynamic temperature (Kelvin, $\\text{K}$).\n\n**Physical Interpretation**: Adding heat energy $\\delta Q$ to a cold system ($T$ small) increases its microstate multiplicity dramatically (large $dS$), whereas adding the same heat to a hot system ($T$ large) creates a much smaller proportional increase in multiplicity.\n\n---\n\n### 5. Worked Numerical Calculation: Isothermal Free Expansion\n\nCalculate the entropy change when **1 mole of ideal gas** ($n = 1\\text{ mol}$) doubles its volume ($V_1 \\to 2V_1$) at constant temperature $T = 300\\text{ K}$:\n\n$$\\Delta S = n R \\ln\\left(\\frac{V_2}{V_1}\\right) = (1\\text{ mol}) \\times (8.314\\text{ J}/\\text{mol}\\cdot\\text{K}) \\times \\ln(2)$$\n$$\\Delta S = 8.314 \\times 0.69315 = +5.763 \\text{ J}/\\text{K}$$\n\n**Physical Meaning**: Because the volume doubled, each molecule has twice as many spatial positions available, increasing total multiplicity $\\Omega$ by a factor of $2^{N_A}$, resulting in a positive entropy gain of $+5.76\\text{ J/K}$.\n\n---\n\n### 6. What the Equation Does NOT Tell Us:\n- It does **not** tell us the *rate* or speed of expansion (thermodynamics is independent of time duration).\n- It does **not** track individual particle trajectories; it is strictly an ensemble average.",
                "misconceptions": "**MISCONCEPTION**: \"Entropy is disorder or messiness.\"\n**CORRECTION**: While \"disorder\" is a common visual shorthand, entropy strictly measures the mathematical multiplicity ($\\Omega$) of microscopic configurations compatible with macroscopic constraints. Highly ordered structures (like ice crystals freezing at sub-zero temperatures) form spontaneously because the latent heat released to the surrounding environment increases the surrounding microstate multiplicity by more than the crystal loses internally.\n**WHY THE CONFUSION HAPPENS**: Shuffled cards, messy rooms, and broken mugs look \"disordered\" to human eyes, creating the false intuition that entropy is a subjective aesthetic property rather than a rigorous physical counting of states.\n\n---\n\n**MISCONCEPTION**: \"Life violates the Second Law of Thermodynamics by creating biological order.\"\n**CORRECTION**: The Second Law strictly applies to **isolated systems**. Living organisms are **open systems** that continuously take in low-entropy energy (food, sunlight) and dissipate high-entropy thermal waste into the environment. The net entropy change of the organism plus its surroundings is strictly positive ($\\Delta S_{\\text{total}} > 0$).\n**WHY THE CONFUSION HAPPENS**: People mistakenly evaluate the cell or organism in isolation rather than including the energetic throughput from its environment.\n\n---\n\n### If You Remember Only Five Things:\n1. **Entropy is state multiplicity**: $S = k_B \\ln \\Omega$ measures how many microscopic arrangements correspond to the macroscopic state you see.\n2. **Equilibrium is statistical dominance**: Closed systems evolve toward equilibrium simply because equilibrium microstates outnumber all other microstates by astronomical proportions.\n3. **The logarithm ensures additivity**: The log converts multiplicative microstate probabilities ($\\Omega_A \\cdot \\Omega_B$) into additive thermodynamic entropy ($S_A + S_B$).\n4. **Irreversibility emerges from scale**: While microscopic particle collisions are reversible, macroscopic reversal is statistically impossible for $10^{23}$ particles.\n5. **Life is an open entropy pump**: Living things maintain internal order by continuously exporting entropy to their surrounding environment.\n\n---\n\n### Questions to Test Your Understanding:\n1. *Why doesn't a glass of lukewarm water spontaneously separate into boiling water on top and ice on the bottom, even though energy would be conserved?*\n2. *If all accessible microstates are equally probable, why do we almost never observe a non-equilibrium state in macroscopic systems?*\n3. *What would happen to the additivity of entropy if we defined $S = k_B \\Omega$ instead of $S = k_B \\ln \\Omega$?*\n4. *Can entropy decrease inside a local subsystem? What must happen to the rest of the universe if it does?*",

                "oneLiner": "Matter is anything that possesses mass and occupies physical space; energy is the conserved mathematical quantity that measures a system's capacity to perform mechanical work or transfer heat.",
                "whyItMatters": "Understanding mass-energy equivalence ($E = mc^2$) and the First Law of Thermodynamics is the foundational basis of all chemistry, particle physics, nuclear energy, and astrophysics.",
                "intuition": "### 0. The Physical Puzzle\nBefore 1905, physics treated matter and energy as two completely separate universes:\n- Matter was made of physical atoms that had mass and could never be created or destroyed (Lavoisier's Law).\n- Energy was an invisible property (heat, motion, electricity) that was also separately conserved (Joule's First Law).\n\nIf mass and energy were separate, why did a radioactive radium salt continuously glow and release heat without any chemical reaction taking place? Where was the energy coming from?\n\n### 1. The Mental Model: Condensed Ice & Steam\nThink of mass and energy like ice and steam. They look completely different, feel different, and obey different immediate mechanics, but both are made of the exact same underlying chemical substance ($H_2O$) in different physical states.\n\nAlbert Einstein's Special Relativity revealed that mass is simply **extremely concentrated, localized energy**. Mass can be converted into free energy (heat and radiation), and energetic fields can condense into physical particles.\n\n### 2. Where This Analogy Stops Being Accurate\nIce and steam are physical molecular arrangements. Mass and energy are fundamental relativistic invariants of spacetime itself governed by the energy-momentum four-vector.",
                "example": "**Everyday Observation**: A compressed mechanical clock spring.\n- When you wind a mechanical watch spring, you do physical work on it. Because that elastic potential energy is stored in the atomic bonds, the wound watch actually gains a tiny, measurable relativistic mass increase $\\Delta m = E / c^2 \\approx 10^{-14}\\text{ grams}$.",
                "howItWorks": "### 3. Step-by-Step Mechanism: Nuclear Mass Defect\n\n1. **The Starting Parts**: A helium-4 nucleus ($^4\\text{He}$) consists of 2 protons and 2 neutrons.\n2. **Weighing Free Particles**:\n   - Mass of 2 free protons $= 2 \\times 1.00728\\text{ u} = 2.01456\\text{ u}$.\n   - Mass of 2 free neutrons $= 2 \\times 1.00866\\text{ u} = 2.01732\\text{ u}$.\n   - Total mass of uncombined parts $= 4.03188\\text{ u}$.\n3. **Weighing the Bound Helium Nucleus**: When protons and neutrons are bound together, the helium nucleus weighs only **$4.00151\\text{ u}$**.\n4. **The Missing Mass Defect ($\\Delta m$)**:\n   $$\\Delta m = 4.03188\\text{ u} - 4.00151\\text{ u} = 0.03037\\text{ u} \\approx 5.04 \\times 10^{-29} \\text{ kg}$$\n5. **Energy Release**: The missing mass was converted into nuclear binding energy ($E = \\Delta m c^2 = 28.3\\text{ MeV}$) and radiated away as energetic gamma rays during nuclear fusion.\n\n- **What moved?** Nucleons assembled under the Strong Nuclear Force.\n- **What changed microscopically?** Potential energy in the nuclear field decreased.\n- **What changed macroscopically?** Measurable rest mass decreased; thermal kinetic energy was released.\n- **What was conserved?** Total relativistic mass-energy.",
                "firstPrinciples": "### 4. Conservation Laws & Emmy Noether's Theorem\n\n1. **Emmy Noether's First Theorem (1915)**:\n   Every continuous mathematical symmetry of the laws of physics corresponds to an exact conservation law.\n   - **Time Translation Symmetry** (the laws of physics are identical today, tomorrow, and a billion years ago) $\\implies$ **Conservation of Energy**.\n   - **Spatial Translation Symmetry** (physics is identical in London and on Mars) $\\implies$ **Conservation of Linear Momentum**.\n2. **Relativistic Invariant Mass**:\n   $$E^2 = (pc)^2 + (m_0 c^2)^2$$\n   For a stationary particle ($p = 0$), this reduces to $E = m_0 c^2$.",
                "mathematics": "### 1. The Mass-Energy Equivalence Equation\n\n$$E = mc^2$$\n\n- **$E$**: Energy in Joules ($\\text{J} = \\text{kg}\\cdot\\text{m}^2/\\text{s}^2$).\n- **$m$**: Rest mass in kilograms ($\\text{kg}$).\n- **$c$**: Speed of light in vacuum ($2.99792458 \\times 10^8 \\text{ m/s}$).\n\n---\n\n### 2. Numerical Calculation: Energy in 1 Gram of Matter\nConvert $1\\text{ gram}$ ($10^{-3}\\text{ kg}$) of matter entirely into energy:\n$$E = (10^{-3}\\text{ kg}) \\times (2.998 \\times 10^8 \\text{ m/s})^2 = 10^{-3} \\times 8.988 \\times 10^{16} \\approx 8.99 \\times 10^{13} \\text{ Joules}$$\n$$E \\approx 25 \\text{ million kilowatt-hours (kWh)}$$\n*This is equivalent to burning approximately 3 million liters of commercial gasoline.*\n\n---\n\n### 3. The First Law of Thermodynamics:\n$$\\Delta U = Q - W$$\n- **$\\Delta U$**: Change in internal energy of the system.\n- **$Q$**: Heat added to the system.\n- **$W$**: Work performed by the system on its surroundings.",
                "misconceptions": "**MISCONCEPTION**: \"Energy is a tangible, glowing physical substance.\"\n**CORRECTION**: Energy is not a physical fluid or material substance; it is a mathematical property and numerical scalar value assigned to a physical state that remains constant throughout all physical transformations.\n**WHY THE CONFUSION HAPPENS**: Science fiction and everyday language depict energy as \"pure glowing plasma.\"\n\n---\n\n### If You Remember Only Five Things:\n1. **Mass and energy are equivalent**: $E = mc^2$ means mass is concentrated, localized energy.\n2. **Energy is conserved by time symmetry**: Noether's theorem proves energy conservation arises because physics is invariant over time.\n3. **Energy is a scalar quantity, not a substance**: It measures capacity to do work or exchange heat.\n4. **Mass defect powers stars**: The sun shines because fused helium is lighter than the raw hydrogen protons that created it.\n5. **First Law limits all engines**: You cannot get more work out of a system than the energy you put in ($\\Delta U = Q - W$).\n\n---\n\n### Questions to Test Understanding:\n1. *Where did the kinetic energy go when a fast-moving car brakes to a complete stop?*\n2. *Why does a hot cup of tea weigh an imperceptibly tiny amount more than the same cup of tea after cooling down?*\n3. *Why does Noether's theorem connect time translation symmetry with energy conservation?*",
                "sources": [
                        {
                                "title": "The Feynman Lectures on Physics (Vol 1)",
                                "author": "Richard Feynman",
                                "type": "BOOK",
                                "notes": "Chapter 4: What is energy and conservation laws."
                        }
                ]

                "oneLiner": "The quantity of usable energy stored per unit volume (volumetric energy density, Wh/L) or per unit mass (gravimetric specific energy, Wh/kg).",
                "whyItMatters": "Energy density is the primary engineering bottleneck determining which transport sectors can be electrified (passenger cars vs. long-haul transoceanic flight).",
                "intuition": "### 0. The Aviation Payload Paradox\nImagine designing a commercial airliner carrying 300 passengers from London to Singapore:\n- **Jet Kerosene**: A Boeing 777 carries $\\sim 100,000\\text{ kg}$ of jet fuel, containing roughly $1.2 \\text{ million kWh}$ of chemical energy.\n- **Lithium-Ion Battery Equivalent**: To store $1.2 \\text{ million kWh}$ with state-of-the-art lithium batteries ($250\\text{ Wh/kg}$), the battery pack would weigh **$4,800,000\\text{ kg}$ (4,800 metric tons)**!\n\nThe airplane weighs only $\\sim 150$ tons empty. A 4,800-ton airplane cannot physically lift off the ground.\n\nGravimetric energy density dictates **what can fly**, while volumetric density dictates **what fits in your pocket** (smartphones).\n\n### 1. Why Hydrocarbons Are Uniquely Dense\nHydrocarbon fuel is composed of concentrated carbon-hydrogen covalent bonds that burn atmospheric oxygen ($O_2$), meaning the airplane does not need to carry the oxidant mass on board. A battery is a self-contained electrochemical cell carrying all heavy cathode and anode host crystal matrices.",
                "example": "**Everyday Observation**: A Tesla Model S battery pack weighing $\\sim 480\\text{ kg}$ stores $100\\text{ kWh}$, whereas $\\sim 8\\text{ kg}$ of gasoline contains the equivalent chemical energy.",
                "howItWorks": "### 3. Step-by-Step Chemical vs. Electrochemical Mechanics\n\n1. **Hydrocarbon Combustion**: Gasoline ($C_8H_{18}$) releases energy when strong $C=O$ and $O-H$ bonds form, breaking weaker $C-C$ and $C-H$ bonds. Specific energy $\\approx 12,000\\text{ Wh/kg}$.\n2. **Lithium-Ion Intercalation**: Energy is stored by shuttling $Li^+$ ions between graphite and a heavy transition metal oxide lattice (e.g. $\\text{LiCoO}_2$). Specific energy $\\approx 250\\text{ Wh/kg}$.\n3. **The Molecular Weight Penalty**: Lithium ions must be held inside heavy host crystal structures, imposing a severe gravimetric mass penalty.",
                "firstPrinciples": "### 4. Theoretical Maximum Electrochemical Potential\n$$\\text{Specific Energy} = \\frac{n F E_{\\text{cell}}}{M_{\\text{active}}}$$\n- **$n$**: Electrons transferred per reaction.\n- **$F$**: Faraday constant ($96,485\\text{ C/mol}$).\n- **$E_{\\text{cell}}$**: Cell potential voltage (Volts).\n- **$M_{\\text{active}}$**: Combined molar mass of active reactants ($\text{kg/mol}$).\n\nThe periodic table sets fundamental limits: Lithium is the lightest solid element ($M = 6.94\\text{ g/mol}$), but the host transition metal oxides ($Co, Ni, Mn$) add heavy structural mass.",
                "mathematics": "### 1. Comparative Energy Density Table\n\n| Storage Medium | Gravimetric Specific Energy | Volumetric Energy Density | Round-Trip Efficiency |\n| :--- | :--- | :--- | :--- |\n| **Kerosene / Jet Fuel** | $12,000 \\text{ Wh/kg}$ | $9,500 \\text{ Wh/L}$ | $\\sim 35\\%$ (Thermal engine) |\n| **Gasoline** | $12,200 \\text{ Wh/kg}$ | $8,800 \\text{ Wh/L}$ | $\\sim 30\\%$ (Thermal engine) |\n| **Hydrogen (Liquid, -253°C)** | $33,300 \\text{ Wh/kg}$ | $2,360 \\text{ Wh/L}$ | $\\sim 50\\%$ (Fuel cell) |\n| **Lithium-Ion Battery (2024)** | $260 \\text{ Wh/kg}$ | $700 \\text{ Wh/L}$ | $\\sim 90\\%$ (Electric motor) |\n\n---\n\n### 2. Numerical Example: Electric Vehicle vs. Gasoline Car\n- Gasoline car carrying $50\\text{ liters}$ of gas ($37\\text{ kg}$): Stores $450\\text{ kWh}$ of thermal energy. At $30\\%$ engine efficiency, delivers $135\\text{ kWh}$ of mechanical wheel work.\n- Tesla Model S carrying $480\\text{ kg}$ battery pack: Stores $100\\text{ kWh}$ of electrical energy. At $90\\%$ motor efficiency, delivers $90\\text{ kWh}$ of mechanical wheel work.\n*Electric motors are 3x more efficient than combustion engines, which partially offsets the heavy battery mass penalty for ground vehicles.*",
                "misconceptions": "**MISCONCEPTION**: \"Batteries will match jet fuel density in a few years with Moore's Law scaling.\"\n**CORRECTION**: Moore's Law applies to semiconductor lithography, not chemistry. Chemical bond energies and periodic table atomic weights impose hard thermodynamic ceilings.\n**WHY THE CONFUSION HAPPENS**: People conflate computing exponential progress with chemical storage physics.\n\n---\n\n### If You Remember Only Five Things:\n1. **Gravimetric vs. Volumetric**: Specific energy (Wh/kg) dictates weight; density (Wh/L) dictates size.\n2. **Hydrocarbons are 45x denser than batteries**: Liquid fuels carry no oxidant mass and store energy in dense covalent bonds.\n3. **Electric motor efficiency offsets battery weight**: Electric drives are ~90% efficient vs. ~30% for thermal combustion engines.\n4. **Aviation is density-limited**: Long-haul commercial aircraft require high gravimetric specific energy.\n5. **Periodic table limits chemistry**: Maximum cell voltage and molecular weight impose fundamental limits on battery capacity.\n\n---\n\n### Questions to Test Understanding:\n1. *Why can passenger cars be electrified today, but long-haul commercial flights cannot?*\n2. *Why is liquid hydrogen volumetric density lower than gasoline despite having 3x higher gravimetric specific energy?*\n3. *Why does drawing oxygen from ambient air give combustion fuels a massive weight advantage over batteries?*",

        "needs-and-incentives": {
                "slug": "needs-and-incentives",
                "title": "Incentives & Human Behavior",
                "chapterSlug": "society-money-mind",
                "chapterTitle": "Society, Money & Mind",
                "difficulty": "FOUNDATION",
                "oneLiner": "Incentives are the structural rewards, penalties, and psychological payoffs that alter the relative costs and benefits of choices, motivating individuals to adapt their behavior.",
                "whyItMatters": "Every economic policy, corporate compensation plan, legal statute, and social institution succeeds or fails based on whether its incentive architecture aligns with desired outcomes.",
                "intuition": "### 0. The Question / Puzzle\nWhy can rewarding the exact behavior you want sometimes make the ultimate outcome dramatically worse?\n\nIf a school pays teachers bonuses based on student test scores, why does real student learning frequently decline? If a hospital penalizes emergency rooms for patient wait times, why do patient mortality rates rise?\n\n### 1. Build the Mental Model: The Cobra Effect\nDuring British colonial rule in Delhi, the government wanted to eradicate venomous cobras. They established a cash bounty for every dead cobra delivered to government offices.\n\nInitially, citizens hunted wild cobras and turned them in. But resourceful citizens soon realized a more lucrative strategy: **they began breeding cobras in their basements to collect steady bounties**.\n\nWhen the government discovered the fraud and canceled the bounty program, the breeders released their worthless snakes into the streets, resulting in **more wild cobras than existed before the policy began**.\n\n### 2. The Critical Distinctions:\n- **Incentive**: An external change in payoffs (financial bounty, tax penalty, promotion).\n- **Constraint**: Physical, legal, or financial limits on available actions (budget ceiling, 24 hours in a day).\n- **Preference**: An internal subjective ranking of outcomes (taste for leisure, risk tolerance).\n- **Intrinsic Motivation**: Engaging in an activity for its inherent satisfaction without external reward.\n- **Social Norm**: Unwritten community expectations enforced by reputation and social approval.",
                "example": "**Real-World Metric Optimization**: A customer service department rewards employees solely on \"Average Call Handling Time\" (shorter calls = bonus). \n- *Employee Adaptation*: Workers hang up on complex customer issues after 90 seconds to preserve their metric, destroying customer satisfaction while achieving 100% bonus targets.",
                "howItWorks": "### 3. Step-by-Step Causal Chain: The Anatomy of Metric Gaming\n\n```\n1. Institution Establishes Target Metric (M) intended as a proxy for Goal (G)\n                ↓\n2. Metric Changes Relative Payoffs of Available Actions\n                ↓\n3. Agents Discover Shortcuts that Maximize (M) without Improving (G)\n                ↓\n4. Agents Shift Cognitive & Physical Effort Toward the Metric Shortcut\n                ↓\n5. Measured Metric (M) Rises while Real Objective (G) Collapses\n```\n\n---\n\n### Goodhart's Law & Campbell's Law\n- **Goodhart's Law**: *\"When a measure becomes a target, it ceases to be a good measure.\"*\n- **Campbell's Law**: *\"The more any quantitative social indicator is used for social decision-making, the more subject it will be to corruption pressures and the more apt it will be to distort and corrupt the social processes it is intended to monitor.\"*",
                "firstPrinciples": "### 4. Axiomatic Foundations: Expected Utility & Bounded Rationality\n\n1. **Choice Under Uncertainty (Expected Utility)**:\n   Whenever humans choose between uncertain actions, they implicitly compare two factors:\n   - How likely each outcome is ($P(x)$).\n   - How valuable or painful that outcome would be ($u(x)$).\n2. **Bounded Rationality (Herbert Simon)**:\n   Humans do not possess infinite computing power, complete information, or perfect foresight. Instead of calculating a global optimum, individuals **satisfice**—they search locally for rules and behaviors that meet their immediate payoff thresholds within their cognitive and institutional constraints.",
                "mathematics": "### 1. What Question Is the Equation Answering?\n*\"How do we mathematically quantify how a rational agent evaluates actions with uncertain outcomes?\"*\n\n---\n\n### 2. The Expected Utility Equation (von Neumann–Morgenstern)\n\n$$\\text{EU}(a) = \\sum_{s \\in S} P(s | a) \\cdot u(s) - C(a)$$\n\n- **$\\text{EU}(a)$**: Expected utility of taking action $a$.\n- **$P(s | a)$**: Probability that state $s$ occurs given action $a$ ($0 \\le P \\le 1$, with $\\sum P = 1$).\n- **$u(s)$**: Subjective utility (satisfaction or payoff) of outcome state $s$.\n- **$C(a)$**: Direct cost or effort required to execute action $a$.\n\n---\n\n### 3. Worked Numerical Decision Example: The Asymmetric Executive Bonus\n\nConsider a hedge fund manager deciding between two investment strategies:\n- **Strategy 1 (Safe Investment)**: $100\\%$ probability of making ₹50,000 profit for the fund.\n  $$\\text{EU}(\\text{Safe}) = 1.0 \\times 50,000 = ₹50,000$$\n- **Strategy 2 (Reckless Speculative Bet)**: \n  - $20\\%$ chance of making ₹500,000 profit.\n  - $80\\%$ chance of losing ₹200,000 for the fund.\n  $$\\text{Expected Fund Return} = (0.2 \\times 500,000) + (0.8 \\times -200,000) = 100,000 - 160,000 = -₹60,000 \\quad (\\text{Destructive!})$$\n\n#### The Incentive Distortion (Moral Hazard):\nSuppose the manager's contract pays a **$20\\%$ performance bonus on positive gains**, but the fund bears $100\\%$ of all losses:\n- Manager's Personal Payoff on Strategy 1: $1.0 \\times (0.2 \\times 50,000) = ₹10,000$.\n- Manager's Personal Payoff on Strategy 2: $(0.2 \\times 100,000) + (0.8 \\times 0) = ₹20,000$.\n\n**Result**: The manager's personal expected utility on the destructive bet (₹20,000) is **double** that of the safe bet (₹10,000). The asymmetric incentive structure rationally induces the manager to bankrupt the company.\n\n---\n\n### 4. What the Equation Does NOT Tell Us:\n- It assumes probabilities and utilities are known; in reality, humans suffer from **Prospect Theory biases** (loss aversion, overweighting small probabilities, and hyperbolic time discounting).",
                "misconceptions": "**MISCONCEPTION**: \"People act purely from direct monetary selfishness.\"\n**CORRECTION**: Human incentives encompass social status, reputation, fairness norms, belonging, and risk avoidance.\n**WHY THE CONFUSION HAPPENS**: Standard introductory economics textbooks simplify models to \"Homo economicus.\"\n\n---\n\n**MISCONCEPTION**: \"Offering higher monetary rewards always improves performance.\"\n**CORRECTION**: Financial incentives can **crowd out intrinsic motivation** (the Titmuss blood donation paradox). When a fine was introduced for parents picking up children late from daycare, late pickups *increased* because parents treated the fine as a price that bought permission to be late, removing moral guilt.\n\n---\n\n### If You Remember Only Five Things:\n1. **People respond to incentives, not intentions**: Behavior aligns with actual payoffs, not policy goals.\n2. **Goodhart's Law**: When a metric becomes a target, it ceases to be a reliable metric.\n3. **Cobra Effect**: Poorly designed incentives create perverse, counterproductive adaptations.\n4. **Asymmetric payoffs induce moral hazard**: Rewarding upside while insulating from downside causes reckless risk-taking.\n5. **Intrinsic motivation can be crowded out**: Adding financial rewards can destroy moral and social norms.\n\n---\n\n### Questions to Test Understanding:\n1. *A software company rewards engineers based on the number of lines of code written. Predict two ways engineers will adapt without writing better software.*\n2. *Why did late daycare pickups increase after a financial late fee was introduced?*\n3. *How does bounded rationality differ from standard expected utility maximization?*",
                "sources": []
        },
        "money-and-exchange": {
                "slug": "money-and-exchange",
                "title": "Money & Mediums of Exchange",
                "chapterSlug": "society-money-mind",
                "chapterTitle": "Society, Money & Mind",
                "difficulty": "CORE",
                "oneLiner": "Money is a social coordination technology and shared accounting ledger that functions as a universally accepted medium of exchange, a unit of account, and a store of value.",
                "whyItMatters": "Understanding money is essential for understanding banking, inflation, interest rates, capital allocation, sovereign debt, and global trade networks.",
                "intuition": "### 0. The Question / Puzzle\nWhy do 8 billion human beings willingly give away physical goods, wheat, cars, and 40 hours of hard weekly labor in exchange for rectangular pieces of colored paper or digital numbers displayed on a computer screen?\n\n### 1. Build the Mental Model: The Double Coincidence of Wants\nImagine a world with direct barter:\n- You are a dentist who needs a loaf of bread.\n- You visit a baker, but the baker has perfect teeth and needs a shoemaker.\n- You must find a shoemaker who has a toothache, fix their tooth in exchange for shoes, and then take the shoes to the baker to buy bread.\n\nThis friction is the **Double Coincidence of Wants**. Barter requires both parties to simultaneously desire what the other holds.\n\nMoney is the coordination technology that solves this problem: anyone can exchange goods or labor for a universally accepted token, knowing that every other network participant will accept it in the future.\n\n### 2. The Three Core Functions of Money:\n1. **Medium of Exchange**: Eliminates barter search friction.\n2. **Unit of Account**: Provides a common denominator to compare the economic value of apples, houses, and legal services.\n3. **Store of Value**: Transports purchasing power across time into the future.",
                "example": "**Everyday Observation**: Using a debit card or UPI to instantly transfer digital ledger balances to buy coffee across town without transporting physical commodities.",
                "howItWorks": "### 3. Step-by-Step Evolution of Monetary Ledgers\n\n1. **Commodity Money**: Physical goods with intrinsic utility (gold, silver, salt, cowrie shells).\n2. **Representative Money**: Paper warehouse deposit receipts backed 1:1 by gold in vault storage.\n3. **Fiat Currency**: State-issued paper notes declared legal tender and accepted for sovereign tax obligations.\n4. **Commercial Bank Deposits**: Digital electronic balances created through bank lending.\n5. **Central Bank Digital Settlement Rails**: Instant gross settlement networks (Fedwire, RTGS, UPI).\n\n---\n\n### How Commercial Banks Actually Create Money: The Balance Sheet Mechanism\n\nPopular belief assumes that banks take savings deposits from savers and lend those exact funds to borrowers. **This is factually incorrect.** \n\nAccording to central banks (Bank of England, Federal Reserve, Deutsche Bundesbank), **commercial banks create new money out of thin air when they make a loan**.\n\n#### Worked Numerical Balance Sheet Example:\nSuppose a commercial bank approves a **₹10,00,000 home loan** for a borrower:\n\n```\n                     COMMERCIAL BANK BALANCE SHEET\n───────────────────────────────────────────────────────────────────────\nASSETS (+ What the Bank Owns)        │ LIABILITIES (+ What the Bank Owes)\n─────────────────────────────────────┼─────────────────────────────────\n+₹10,00,000 (Loan Contract Receivable)│ +₹10,00,000 (New Customer Deposit Balance)\n                                     │\n```\n\n- **What happened?** The bank did NOT move cash out of a vault.\n- The bank credited the customer's checking account with ₹10,00,000 (a new liability for the bank) in exchange for the signed loan contract (a new asset for the bank).\n- **Result**: The broad money supply ($M_1$) in the economy has expanded by exactly ₹10,00,000. When the borrower repays the principal, that money is extinguished.\n\n---\n\n### Central Bank Base Money ($M_0$) vs. Commercial Bank Deposits ($M_1$)\n- **Base Money ($M_0$)**: Physical cash plus central bank reserves (used strictly between commercial banks and the central bank for interbank settlement).\n- **Broad Money ($M_1, M_2$)**: The digital commercial bank deposit balances used by everyday businesses and citizens for daily commerce.",
                "firstPrinciples": "### 4. Why Fiat Money Has Purchasing Power Without Commodity Backing\n\nWhy does a ₹500 or $100 fiat bill have value if it cannot be redeemed for gold?\n1. **Sovereign Tax Foundation (Chartalism)**: The sovereign government demands taxes payable strictly in its designated fiat token. If you do not pay, legal force ensues. This establishes a baseline national demand for the currency.\n2. **Legal Tender Laws**: The state enforces contracts and debts in the national currency.\n3. **Network Effects & Schelling Coordination**: Because everyone expects others to accept the currency tomorrow, it is individually rational to accept it today.",
                "mathematics": "### 1. The Quantity Theory of Money (Equation of Exchange)\n\n$$M \\cdot V = P \\cdot Y$$\n\n- **$M$**: Total nominal money supply in circulation (currency units, e.g. ₹ or $).\n- **$V$**: Velocity of money (number of times an average unit of currency is spent per year).\n- **$P$**: Aggregate price level index.\n- **$Y$**: Real annual economic output (Real GDP).\n\n---\n\n### 2. Accounting Identity vs. Economic Theory:\n- **As an Accounting Identity**: $M \\cdot V \\equiv P \\cdot Y$ is always 100% mathematically true by definition: Total Money Spent ($M \\cdot V$) must equal Total Nominal Value of Goods Purchased ($P \\cdot Y$).\n- **As an Economic Theory (Monetarism)**: Milton Friedman asserted that velocity $V$ and output $Y$ are relatively stable in the long run, implying that sustained expansion of money supply $M$ must lead directly to proportional increases in price levels $P$ (inflation).\n\n---\n\n### 3. Worked Numerical Calculation: Why Velocity ($V$) Matters\nSuppose an economy has:\n- Money supply $M = ₹1,000\\text{ billion}$.\n- Real output $Y = 100\\text{ million units of goods}$.\n- Price per unit $P = ₹20,000$.\n- Nominal GDP $= P \\cdot Y = ₹2,000\\text{ billion}$.\n\n$$V = \\frac{P \\cdot Y}{M} = \\frac{2,000}{1,000} = 2.0 \\text{ turnovers per year}$$\n\n#### What happens during a Financial Crisis (The Liquidity Trap)?\nIf the central bank doubles money supply to $M = ₹2,000\\text{ billion}$, but public panic causes velocity to collapse by half to $V = 1.0$:\n$$P \\cdot Y = M \\cdot V = 2,000 \\times 1.0 = ₹2,000\\text{ billion}$$\n*Total spending and price level remain completely flat because the drop in velocity fully neutralized the increase in money supply!*",
                "misconceptions": "**MISCONCEPTION**: \"Banks simply intermediate existing savings between depositors and borrowers.\"\n**CORRECTION**: Commercial banks create new deposit money ex nihilo through double-entry balance sheet expansion whenever they extend loans.\n**WHY THE CONFUSION HAPPENS**: Traditional simplified textbook fractional-reserve multiplier models imply lending is constrained strictly by preexisting deposits.\n\n---\n\n**MISCONCEPTION**: \"Printing money automatically causes runaway inflation immediately.\"\n**CORRECTION**: Inflation depends on the product $M \\cdot V$ relative to productive capacity $Y$. If money supply grows while velocity collapses (liquidity trap) or spare capacity exists, inflation may remain low.\n\n---\n\n### If You Remember Only Five Things:\n1. **Money is a coordination ledger**: Solves the double coincidence of wants.\n2. **Three core functions**: Medium of exchange, unit of account, store of value.\n3. **Commercial banks create money through loans**: Expanding assets (loan) and liabilities (deposit) simultaneously.\n4. **The Equation of Exchange**: $M \\cdot V = P \\cdot Y$ connects money, velocity, prices, and output.\n5. **Fiat value rests on sovereign taxation & trust**: Taxes create fundamental baseline demand for national currency.\n\n---\n\n### Questions to Test Understanding:\n1. *A commercial bank approves a ₹50 lakh business loan. What specific changes occur on the bank's balance sheet?*\n2. *If the central bank doubles the money supply during a panic, why might inflation remain near zero?*\n3. *Why can a fiat currency maintain purchasing power without being convertible into gold?*",
                "sources": []
        },

    // Bulletproof Navigation Router
    function navigate(route, param) {
      const cleanRoute = (route || 'home').replace(/^\/+|\/+$/g, '');
      const cleanParam = (param || '').replace(/^\/+|\/+$/g, '');
      const targetHash = cleanParam ? `${cleanRoute}/${cleanParam}` : cleanRoute;
      
      if (window.location.hash !== '#' + targetHash) {
        window.location.hash = targetHash;
      } else {
        renderApp();
      }
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function renderApp() {
      // Robust Hash Parser
      // Handles '#/concepts/matter-and-energy', '#concepts/matter-and-energy', '?query=...', etc.
      const rawHash = (window.location.hash || '').replace(/^#[\/]?/, '').split('?')[0].replace(/\/+$/, '');
      const parts = rawHash ? rawHash.split('/') : ['home'];
      const page = (parts[0] || 'home').toLowerCase().trim();
      const param = parts.slice(1).join('/').trim();

      const app = document.getElementById('app');
      if (!app) return;

      if (page === 'home' || page === '') {
        renderHome(app);
      } else if (page === 'library') {
        renderLibrary(app);
      } else if (page === 'chapters' || page === 'chapter' || page === 'vol' || page === 'volume') {
        renderChapter(app, param);
      } else if (page === 'concepts' || page === 'concept') {
        renderConcept(app, param);
      } else if (page === 'connections' || page === 'connection') {
        renderConnections(app);
      } else if (page === 'sources' || page === 'source') {
        renderSources(app);
      } else if (page === 'questions' || page === 'question') {
        renderQuestions(app);
      } else if (page === 'inbox') {
        renderInbox(app);
      } else if (page === 'add') {
        renderAdd(app);
      } else {
        // Check if page itself is a concept slug (e.g. #entropy or #matter-and-energy)

        });

        function formatMarkdown(text) {
      if (!text) return '';
      
      const lines = text.replace(/\r\n/g, '\n').split('\n');
      let html = '';
      let inList = false;
      let listType = '';
      let inTable = false;
      let tableRows = [];
      let inCodeBlock = false;
      let codeBlockLines = [];

      function flushList() {
        if (inList) {
          html += listType === 'ol' ? '</ol>' : '</ul>';
          inList = false;
          listType = '';
        }
      }

      function flushTable() {
        if (inTable) {
          if (tableRows.length > 0) {
            html += '<div class="overflow-x-auto my-4"><table class="w-full text-left text-xs sm:text-sm border-collapse border border-slate-200 dark:border-slate-800 shadow-sm rounded-lg overflow-hidden">';
            tableRows.forEach((r, idx) => {
              const cols = r.split('|').filter((_, cIdx, arr) => cIdx > 0 && cIdx < arr.length - 1);
              if (idx === 0) {
                html += '<thead class="bg-slate-100 dark:bg-slate-800/90 font-mono text-[11px] uppercase tracking-wider text-slate-700 dark:text-slate-300"><tr>' + cols.map(c => '<th class="p-3 border border-slate-200 dark:border-slate-800 font-bold">' + formatInlineText(c.trim()) + '</th>').join('') + '</tr></thead><tbody>';
              } else {
                html += '<tr class="hover:bg-slate-50/80 dark:hover:bg-slate-800/40 transition-colors">' + cols.map(c => '<td class="p-3 border border-slate-200 dark:border-slate-800 text-slate-800 dark:text-slate-200">' + formatInlineText(c.trim()) + '</td>').join('') + '</tr>';
              }
            });
            html += '</tbody></table></div>';
          }
          inTable = false;
          tableRows = [];
        }
      }

      function flushCodeBlock() {
        if (inCodeBlock) {
          html += '<pre class="my-4 p-4 rounded-xl bg-slate-900 text-slate-100 dark:bg-[#070b12] text-xs font-mono overflow-x-auto border border-slate-800 leading-relaxed"><code>' + escapeHtml(codeBlockLines.join('\n')) + '</code></pre>';
          inCodeBlock = false;
          codeBlockLines = [];
        }
      }

      for (let i = 0; i < lines.length; i++) {
        const line = lines[i];
        const trimmed = line.trim();

        if (trimmed.startsWith('```')) {
          if (inCodeBlock) {
            flushCodeBlock();
          } else {
            flushList();
            flushTable();
            inCodeBlock = true;
            codeBlockLines = [];
          }
          continue;
        }

        if (inCodeBlock) {
          codeBlockLines.push(line);
          continue;
        }

        if (!trimmed) {
          flushList();
          flushTable();
          continue;
        }

        // Horizontal rule
        if (trimmed === '---') {
          flushList();
          flushTable();
          html += '<hr class="my-6 border-slate-200 dark:border-slate-800" />';
          continue;
        }

        // Standalone KaTeX display block
        if (trimmed.startsWith('$$') && trimmed.endsWith('$$')) {
          flushList();
          flushTable();
          html += '<div class="math-block text-center text-sm sm:text-base border border-slate-200 dark:border-slate-800 bg-white/80 dark:bg-[#0f1520] text-slate-900 dark:text-slate-100 my-4 shadow-sm">' + trimmed + '</div>';
          continue;
        }

        // Headings
        if (trimmed.startsWith('### ')) {
          flushList();
          flushTable();
          html += '<h3 class="text-lg sm:text-xl font-serif font-bold text-slate-900 dark:text-white pt-5 pb-1 border-b border-slate-200 dark:border-slate-800">' + formatInlineText(trimmed.replace('### ', '')) + '</h3>';
          continue;
        }
        if (trimmed.startsWith('#### ')) {
          flushList();
          flushTable();
          html += '<h4 class="text-base sm:text-lg font-serif font-semibold text-slate-900 dark:text-white pt-3 pb-0.5">' + formatInlineText(trimmed.replace('#### ', '')) + '</h4>';
          continue;
        }

        // Misconception Box Lines
        if (trimmed.startsWith('**MISCONCEPTION**:')) {
          flushList();
          flushTable();
          html += '<div class="my-4 rounded-xl border border-rose-500/20 bg-rose-50/40 dark:bg-rose-950/20 p-4 space-y-1"><span class="text-[10px] font-mono font-bold uppercase tracking-wider px-2 py-0.5 rounded bg-rose-500/10 text-rose-700 dark:text-rose-400 border border-rose-500/20">Common Misconception</span><p class="text-sm font-serif font-semibold text-slate-900 dark:text-white pt-1">' + formatInlineText(trimmed.replace('**MISCONCEPTION**:', '').trim()) + '</p></div>';
          continue;
        }
        if (trimmed.startsWith('**CORRECTION**:')) {
          flushList();
          flushTable();
          html += '<div class="my-4 rounded-xl border border-emerald-500/20 bg-emerald-50/40 dark:bg-emerald-950/20 p-4 space-y-1"><span class="text-[10px] font-mono font-bold uppercase tracking-wider px-2 py-0.5 rounded bg-emerald-500/10 text-emerald-700 dark:text-emerald-400 border border-emerald-500/20">Scientific Correction</span><p class="text-sm text-slate-800 dark:text-slate-200 pt-1">' + formatInlineText(trimmed.replace('**CORRECTION**:', '').trim()) + '</p></div>';
          continue;
        }
        if (trimmed.startsWith('**WHY THE CONFUSION HAPPENS**:')) {
          flushList();
          flushTable();
          html += '<div class="my-3 p-3 rounded-lg border border-amber-500/20 bg-amber-50/30 dark:bg-amber-950/10 text-xs text-slate-600 dark:text-slate-400 font-sans"><strong class="text-slate-800 dark:text-slate-200 font-mono">Why Confusion Happens: </strong>' + formatInlineText(trimmed.replace('**WHY THE CONFUSION HAPPENS**:', '').trim()) + '</div>';
          continue;
        }

        // Table Rows
        if (trimmed.startsWith('|') && trimmed.endsWith('|')) {
          if (trimmed.includes('---')) continue;
          flushList();
          inTable = true;
          tableRows.push(trimmed);
          continue;
        } else {
          flushTable();
        }

        // Unordered Lists
        if (trimmed.startsWith('- ') || trimmed.startsWith('* ')) {
          if (!inList || listType !== 'ul') {
            flushList();
            inList = true;
            listType = 'ul';
            html += '<ul class="space-y-2 my-3 pl-5 list-disc text-sm sm:text-base marker:text-emerald-600 dark:marker:text-emerald-400">';
          }
          html += '<li class="leading-relaxed">' + formatInlineText(trimmed.replace(/^[-*]\s+/, '')) + '</li>';
          continue;
        }

        // Ordered Lists
        if (/^\d+\.\s+/.test(trimmed)) {
          if (!inList || listType !== 'ol') {
            flushList();
            inList = true;
            listType = 'ol';
            html += '<ol class="space-y-2 my-3 pl-5 list-decimal text-sm sm:text-base marker:text-emerald-600 dark:marker:text-emerald-400 font-sans">';
          }
          html += '<li class="leading-relaxed">' + formatInlineText(trimmed.replace(/^\d+\.\s+/, '')) + '</li>';
          continue;
        }

        // Standard Paragraph
        flushList();
        html += '<p class="text-base sm:text-lg leading-relaxed text-slate-800 dark:text-slate-200 my-3">' + formatInlineText(trimmed) + '</p>';
      }

      flushList();
      flushTable();
      flushCodeBlock();

      return html;
    }

    function formatInlineText(str) {
      if (!str) return '';
      return str
        .replace(/\*\*(.*?)\*\*/g, '<strong class="font-semibold text-slate-900 dark:text-white">$1</strong>')
        .replace(/\*(.*?)\*/g, '<em class="italic text-slate-800 dark:text-slate-200">$1</em>')
        .replace(/`([^`]+)`/g, '<code class="text-xs font-mono bg-slate-100 dark:bg-slate-800 px-1.5 py-0.5 rounded text-emerald-700 dark:text-emerald-400 border border-slate-200 dark:border-slate-700">$1</code>');
    }

    function escapeHtml(text) {
      if (!text) return '';
      return text
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

              <i data-lucide="lightbulb" class="w-4 h-4"></i>
              <span>Level 2 · Build the Mental Model</span>
            </div>
            <div class="space-y-3 font-serif">${formatMarkdown(concept.intuition)}</div>
            ${concept.example ? `
              <div class="p-4 rounded-xl border border-slate-200 dark:border-slate-800 bg-white/80 dark:bg-[#0f1520] text-xs font-mono text-slate-600 dark:text-slate-400 shadow-sm">
                <strong class="text-emerald-700 dark:text-emerald-400 font-semibold">Concrete Thought Experiment:</strong> ${concept.example}
              </div>
            ` : ''}
          </section>

          <!-- Level 3: Show the Mechanism -->
          <section class="space-y-4 pt-6 border-t border-slate-200/80 dark:border-slate-800">
            <div class="flex items-center space-x-2 text-xs font-mono uppercase tracking-widest text-emerald-700 dark:text-emerald-400 font-bold">
              <i data-lucide="cpu" class="w-4 h-4"></i>
              <span>Level 3 · Show the Mechanism</span>
            </div>
            <div class="space-y-3 font-serif">${formatMarkdown(concept.howItWorks)}</div>
          </section>

          <!-- Level 4: From First Principles -->
          <section class="space-y-4 pt-6 border-t border-slate-200/80 dark:border-slate-800">
            <div class="flex items-center space-x-2 text-xs font-mono uppercase tracking-widest text-emerald-700 dark:text-emerald-400 font-bold">
              <i data-lucide="compass" class="w-4 h-4"></i>
              <span>Level 4 · From First Principles</span>
            </div>
            <div class="space-y-3 font-serif">${formatMarkdown(concept.firstPrinciples)}</div>
          </section>

          <!-- Level 5: The Mathematics -->
          <section class="space-y-4 pt-6 border-t border-slate-200/80 dark:border-slate-800">
            <div class="flex items-center space-x-2 text-xs font-mono uppercase tracking-widest text-emerald-700 dark:text-emerald-400 font-bold">
              <i data-lucide="binary" class="w-4 h-4"></i>
              <span>Level 5 · The Mathematics</span>
            </div>
            <div class="space-y-3 font-serif">${formatMarkdown(concept.mathematics)}</div>
          </section>

          <!-- Limitations, Misconceptions & Takeaways -->
          <section class="space-y-4 pt-6 border-t border-slate-200/80 dark:border-slate-800">
            <div class="flex items-center space-x-2 text-xs font-mono uppercase tracking-widest text-amber-700 dark:text-amber-400 font-bold">
              <i data-lucide="alert-circle" class="w-4 h-4"></i>
              <span>Limitations, Misconceptions & Self-Test Audit</span>
            </div>
            <div class="space-y-3 font-serif">${formatMarkdown(concept.misconceptions)}</div>
          </section>

          <!-- Source Provenance -->
          ${concept.sources && concept.sources.length > 0 ? `
            <section class="space-y-3 pt-6 border-t border-slate-200 dark:border-slate-800">
              <div class="flex items-center space-x-2 text-xs font-mono uppercase tracking-widest text-emerald-700 dark:text-emerald-400 font-bold">
                <i data-lucide="book-open" class="w-4 h-4"></i>
                <span>Verified Source Provenance</span>
              </div>
              <div class="space-y-2">
                ${concept.sources.map(s => `
                  <div class="p-4 rounded-xl border border-slate-200 dark:border-slate-800 bg-white/80 dark:bg-[#0f1520] text-xs font-mono space-y-1 shadow-sm">
                    <div class="flex items-center justify-between text-slate-800 dark:text-slate-200">
                      <span class="font-bold text-slate-900 dark:text-white">${s.title}</span>
                      <span class="text-[10px] text-emerald-700 dark:text-emerald-400 font-semibold px-2 py-0.5 rounded bg-emerald-500/10 border border-emerald-500/20">${s.type}</span>
                    </div>
                    <div class="text-slate-500 font-sans">Author: ${s.author}</div>
                    <p class="text-slate-600 dark:text-slate-400 font-sans pt-1">${s.notes}</p>
                  </div>
                `).join('')}
              </div>
            </section>
          ` : ''}
        </article>
      `;
    }


    function renderConnections(container) {
      container.innerHTML = `
        <div class="space-y-8 max-w-4xl mx-auto">
          <div class="space-y-2 border-b border-slate-200 dark:border-slate-800 pb-6">
            <span class="text-xs font-mono uppercase tracking-widest text-emerald-700 dark:text-emerald-400 font-bold">Cross-Domain Isomorphisms</span>
            <h1 class="text-3xl sm:text-4xl font-serif font-bold text-slate-900 dark:text-white">The Knowledge Lattice</h1>
            <p class="text-sm text-slate-600 dark:text-slate-400">Discovering structural bridges across Physics, Biology, Economics, and Complex Systems.</p>
          </div>
          <div class="space-y-4">
            ${KNOWLEDGE_DB.connections.map(c => `
              <div class="p-6 rounded-2xl border border-slate-200/90 dark:border-slate-800 bg-white/80 dark:bg-[#0f1520]/80 hover:border-emerald-500/40 hover:shadow-sm transition-all space-y-3">
                <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-2">
                  <div class="flex items-center gap-2 font-serif font-bold text-lg text-slate-900 dark:text-white">
                    <span onclick="navigate('concepts', '${c.sourceSlug}')" class="cursor-pointer hover:text-emerald-700 dark:hover:text-emerald-400 transition-colors">${c.source}</span>
                    <i data-lucide="arrow-left-right" class="w-4 h-4 text-emerald-600 dark:text-emerald-400"></i>
                    <span onclick="navigate('concepts', '${c.targetSlug}')" class="cursor-pointer hover:text-emerald-700 dark:hover:text-emerald-400 transition-colors">${c.target}</span>
                  </div>
                  <span class="text-[10px] font-mono px-2.5 py-0.5 rounded bg-amber-500/10 text-amber-800 dark:text-amber-300 border border-amber-500/20 uppercase font-semibold">${c.type}</span>

              </div>
            `).join('')}
          </div>
        </div>
      `;
    }

    function renderSources(container) {
      container.innerHTML = `
        <div class="space-y-8 max-w-4xl mx-auto">
          <div class="space-y-2 border-b border-slate-200 dark:border-slate-800 pb-6">
            <span class="text-xs font-mono uppercase tracking-widest text-emerald-700 dark:text-emerald-400 font-bold">Literature & Provenance</span>
            <h1 class="text-3xl sm:text-4xl font-serif font-bold text-slate-900 dark:text-white">Verified Reference Sources</h1>
            <p class="text-sm text-slate-600 dark:text-slate-400">Grounding every encyclopedia concept in verified scientific papers, textbooks, and lectures.</p>
          </div>
          <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div class="p-5 rounded-2xl border border-slate-200/90 dark:border-slate-800 bg-white/80 dark:bg-[#0f1520] space-y-2">
              <span class="text-[10px] font-mono uppercase text-emerald-700 dark:text-emerald-400 font-bold">BOOK</span>
              <h3 class="font-serif font-bold text-lg text-slate-900 dark:text-white">An Introduction to Thermal Physics</h3>
              <p class="text-xs text-slate-500 font-mono">Author: Daniel V. Schroeder (Oxford University Press, 1999)</p>
              <p class="text-xs text-slate-600 dark:text-slate-300 font-sans">Connecting microscopic state multiplicity directly to thermodynamic entropy.</p>
            </div>
            <div class="p-5 rounded-2xl border border-slate-200/90 dark:border-slate-800 bg-white/80 dark:bg-[#0f1520] space-y-2">
              <span class="text-[10px] font-mono uppercase text-emerald-700 dark:text-emerald-400 font-bold">BOOK</span>
              <h3 class="font-serif font-bold text-lg text-slate-900 dark:text-white">What Is Life?</h3>
              <p class="text-xs text-slate-500 font-mono">Author: Erwin Schrödinger (Cambridge University Press, 1944)</p>
              <p class="text-xs text-slate-600 dark:text-slate-300 font-sans">Non-equilibrium thermodynamics of living cells and biological order.</p>
            </div>
            <div class="p-5 rounded-2xl border border-slate-200/90 dark:border-slate-800 bg-white/80 dark:bg-[#0f1520] space-y-2">
              <span class="text-[10px] font-mono uppercase text-emerald-700 dark:text-emerald-400 font-bold">PAPER</span>
              <h3 class="font-serif font-bold text-lg text-slate-900 dark:text-white">More Is Different</h3>
              <p class="text-xs text-slate-500 font-mono">Author: Philip W. Anderson (Science, 1972)</p>
              <p class="text-xs text-slate-600 dark:text-slate-300 font-sans">Hierarchical broken symmetry and emergent physical laws.</p>
            </div>
            <div class="p-5 rounded-2xl border border-slate-200/90 dark:border-slate-800 bg-white/80 dark:bg-[#0f1520] space-y-2">
              <span class="text-[10px] font-mono uppercase text-emerald-700 dark:text-emerald-400 font-bold">PAPER</span>
              <h3 class="font-serif font-bold text-lg text-slate-900 dark:text-white">A Mathematical Theory of Communication</h3>
              <p class="text-xs text-slate-500 font-mono">Author: Claude E. Shannon (Bell Labs, 1948)</p>
              <p class="text-xs text-slate-600 dark:text-slate-300 font-sans">Information entropy, bit limits, and fundamental data compression.</p>
            </div>
          </div>
        </div>
      `;
    }

    function renderQuestions(container) {
      container.innerHTML = `
        <div class="space-y-8 max-w-4xl mx-auto">
          <div class="space-y-2 border-b border-slate-200 dark:border-slate-800 pb-6">
            <span class="text-xs font-mono uppercase tracking-widest text-emerald-700 dark:text-emerald-400 font-bold">Curiosity Radar</span>
            <h1 class="text-3xl sm:text-4xl font-serif font-bold text-slate-900 dark:text-white">Open Inquiries & Questions</h1>
            <p class="text-sm text-slate-600 dark:text-slate-400">Navigational doorways exploring the frontiers of our current understanding.</p>
          </div>
          <div class="space-y-4">
            ${KNOWLEDGE_DB.questions.map(q => `
              <div class="p-5 rounded-2xl border border-slate-200/90 dark:border-slate-800 bg-white/80 dark:bg-[#0f1520] space-y-2">
                <div class="flex justify-between items-start gap-2">
                  <h3 class="text-base font-serif font-semibold text-slate-900 dark:text-white">${q.question}</h3>
                  <span class="text-[10px] font-mono px-2 py-0.5 rounded bg-emerald-500/10 text-emerald-700 dark:text-emerald-300 border border-emerald-500/20 font-bold">${q.status}</span>
                </div>
                <p class="text-xs text-slate-600 dark:text-slate-400 font-sans">${q.description}</p>
                <div class="pt-2 flex items-center gap-2 text-xs font-mono text-slate-500">
                  <span>Volume: ${q.chapter}</span>
                  <span>•</span>
                  <span onclick="navigate('concepts', '${q.conceptSlug}')" class="text-emerald-700 dark:text-emerald-400 hover:underline cursor-pointer font-semibold">Concept: ${q.concept}</span>
                </div>
              </div>
            `).join('')}
          </div>
        </div>
      `;
    }

    function renderInbox(container) {
      container.innerHTML = `
        <div class="space-y-8 max-w-4xl mx-auto">
          <div class="space-y-2 border-b border-slate-200 dark:border-slate-800 pb-6">
            <span class="text-xs font-mono uppercase tracking-widest text-emerald-700 dark:text-emerald-400 font-bold">Human-in-the-Loop Review</span>
            <h1 class="text-3xl sm:text-4xl font-serif font-bold text-slate-900 dark:text-white">Research Staging Buffer</h1>
            <p class="text-sm text-slate-600 dark:text-slate-400">Captured items and AI proposals remain here until verified by you before joining the permanent tree.</p>
          </div>
          <div class="space-y-4">
            ${KNOWLEDGE_DB.inbox.map(item => `
              <div class="p-6 rounded-2xl border border-slate-200/90 dark:border-slate-800 bg-white/80 dark:bg-[#0f1520] space-y-4">
                <div class="flex justify-between items-start">
                  <h3 class="text-lg font-serif font-bold text-slate-900 dark:text-white">${item.title}</h3>
                  <span class="text-[10px] font-mono px-2 py-0.5 rounded bg-amber-500/10 text-amber-800 dark:text-amber-300 border border-amber-500/20 font-bold">${item.status}</span>
                </div>
                <p class="text-xs text-slate-600 dark:text-slate-300 font-sans">${item.summary}</p>
                <div class="p-3 rounded-xl bg-slate-100 dark:bg-slate-900 border border-slate-200 dark:border-slate-800 flex items-center justify-between text-xs font-mono">
                  <span class="text-slate-600 dark:text-slate-400">Proposed Target: <strong class="text-emerald-700 dark:text-emerald-400">${item.chapter}</strong></span>
                  <button onclick="alert('Proposal committed to knowledge tree!')" class="px-3 py-1 rounded bg-emerald-600 hover:bg-emerald-700 text-white font-semibold">Accept & Commit</button>
                </div>
              </div>
            `).join('')}
          </div>
        </div>
      `;
    }

    function renderAdd(container) {
      container.innerHTML = `
        <div class="max-w-2xl mx-auto space-y-8">
          <div class="space-y-2 border-b border-slate-200 dark:border-slate-800 pb-6">
            <span class="text-xs font-mono uppercase tracking-widest text-emerald-700 dark:text-emerald-400 font-bold">Capture Workbench</span>
            <h1 class="text-3xl sm:text-4xl font-serif font-bold text-slate-900 dark:text-white">Add to Aravalli</h1>
            <p class="text-sm text-slate-600 dark:text-slate-400">Capture a paper, lecture, video, book excerpt, or personal research note.</p>
          </div>

          <form onsubmit="handleCapture(event)" class="space-y-5">
            <div class="space-y-2">
              <label class="block text-xs font-mono uppercase text-slate-700 dark:text-slate-300 font-bold">What did you discover?</label>
              <textarea id="capture-content" rows="6" placeholder="Paste raw text, paper abstract, transcript snippet, or theoretical thought..." class="w-full rounded-2xl border border-slate-300 dark:border-slate-800 bg-white dark:bg-[#0f1520] p-4 text-sm text-slate-900 dark:text-white placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-emerald-500 font-sans"></textarea>
            </div>
            <div class="space-y-1.5">
              <label class="block text-xs font-mono text-slate-500">Source URL (optional)</label>
              <input id="capture-url" type="url" placeholder="https://... (ArXiv, YouTube, Article)" class="w-full rounded-xl border border-slate-300 dark:border-slate-800 bg-white dark:bg-[#0f1520] px-4 py-2 text-xs font-mono text-slate-900 dark:text-white placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-emerald-500" />
            </div>
            <button type="submit" class="w-full py-3 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-mono font-bold transition-all flex items-center justify-center gap-2 shadow-sm">
              <i data-lucide="plus-circle" class="w-4 h-4"></i>
              <span>Add to Inbox Staging Buffer</span>
            </button>
          </form>
        </div>
      `;
    }

    function handleCapture(e) {
      e.preventDefault();
      const content = document.getElementById('capture-content').value;
      if (!content.trim()) return;

      KNOWLEDGE_DB.inbox.push({
        id: 'item-' + Date.now(),
        title: content.slice(0, 50) + '...',
        status: 'REVIEW',
        summary: 'Captured insight: ' + content.slice(0, 150) + '...',
        chapter: 'Universe & Physics'
      });

      alert('Captured successfully into Inbox Staging Buffer!');
      navigate('inbox');
    }

    // Search Engine
    function openSearch() {
      document.getElementById('search-modal').classList.remove('hidden');
      document.getElementById('search-input').focus();
    }

    function closeSearch(e) {
      document.getElementById('search-modal').classList.add('hidden');
    }

    function handleSearch(query) {
      const q = query.toLowerCase().trim();
      const resultsContainer = document.getElementById('search-results');
      if (!q) {
        resultsContainer.innerHTML = '<div class="p-4 text-center text-xs font-mono text-slate-500">Type to search the knowledge graph...</div>';
        return;
      }

      let matches = [];
      // Search concepts
      Object.values(KNOWLEDGE_DB.concepts).forEach(c => {
        if (c.title.toLowerCase().includes(q) || c.oneLiner.toLowerCase().includes(q)) {
          matches.push({ type: 'CONCEPT', title: c.title, meta: c.chapterTitle, slug: c.slug });
        }
      });
      // Search connections
      KNOWLEDGE_DB.connections.forEach(c => {
        if (c.source.toLowerCase().includes(q) || c.target.toLowerCase().includes(q) || c.explanation.toLowerCase().includes(q)) {
          matches.push({ type: 'CONNECTION', title: `${c.source} ↔ ${c.target}`, meta: c.type, slug: c.sourceSlug });
        }
      });
      // Search questions
      KNOWLEDGE_DB.questions.forEach(qItem => {
        if (qItem.question.toLowerCase().includes(q) || qItem.description.toLowerCase().includes(q)) {
          matches.push({ type: 'QUESTION', title: qItem.question, meta: qItem.chapter, slug: qItem.conceptSlug });
        }
      });

      if (matches.length === 0) {
        resultsContainer.innerHTML = '<div class="p-4 text-center text-xs font-mono text-slate-500">No knowledge found matching "' + query + '"</div>';
        return;
      }

      resultsContainer.innerHTML = matches.map(m => `
        <div onclick="navigate('concepts', '${m.slug}'); closeSearch();" class="p-3 rounded-xl hover:bg-slate-100 dark:hover:bg-slate-800 cursor-pointer flex items-center justify-between">
          <div>
            <span class="text-[9px] font-mono uppercase px-1.5 py-0.5 rounded bg-emerald-500/10 text-emerald-700 dark:text-emerald-400 border border-emerald-500/20 font-bold">${m.type}</span>
            <div class="font-serif font-semibold text-sm text-slate-900 dark:text-white pt-1">${m.title}</div>
          </div>
          <span class="text-xs font-mono text-slate-500">${m.meta}</span>
        </div>
      `).join('');
    }

    // Theme toggle
    function toggleTheme() {
      const isDark = document.documentElement.classList.contains('dark');
      if (isDark) {
        document.documentElement.classList.remove('dark');
        localStorage.setItem('aravalli_theme', 'light');
      } else {
        document.documentElement.classList.add('dark');
        localStorage.setItem('aravalli_theme', 'dark');
      }
      updateThemeIcon();
    }

    function updateThemeIcon() {
      const icon = document.getElementById('theme-icon');
      if (!icon) return;
      const isDark = document.documentElement.classList.contains('dark');
      if (isDark) {
        icon.setAttribute('data-lucide', 'sun');
        icon.className = 'w-4 h-4 text-amber-400';
      } else {
        icon.setAttribute('data-lucide', 'moon');
        icon.className = 'w-4 h-4 text-slate-700';
      }
      if (window.lucide) lucide.createIcons();
    }

    // Init theme from preference
    (function initTheme() {
      const saved = localStorage.getItem('aravalli_theme');
      if (saved === 'light') {
        document.documentElement.classList.remove('dark');
      } else {
        document.documentElement.classList.add('dark');
      }
    })();

    // Keyboard shortcuts
    window.addEventListener('keydown', (e) => {
      if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') {
        e.preventDefault();
        openSearch();
      }
      if (e.key === 'Escape') {
        closeSearch();
      }
    });

    window.addEventListener('hashchange', renderApp);
    window.addEventListener('DOMContentLoaded', () => {
      renderApp();
      updateThemeIcon();
    });
  </script>
</body>
</html>
